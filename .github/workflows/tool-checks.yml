name: Caster and Conduit

on:
  push:
    paths:
      - 'caster/**'
      - 'conduit/**'
      - '.github/workflows/tool-checks.yml'
  pull_request:
    paths:
      - 'caster/**'
      - 'conduit/**'
      - '.github/workflows/tool-checks.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tool-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        module: [caster, conduit]
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      GOWORK: 'off'
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: ${{ matrix.module }}/go.mod
          cache-dependency-path: |
            caster/go.sum
            conduit/go.sum
      - name: modules
        run: |
          go mod verify
          go mod tidy -diff
      - name: format
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then
            echo "$out"
            exit 1
          fi
      - name: vet
        run: go vet ./...
      - name: build Caster for Conduit integration
        if: matrix.module == 'conduit'
        working-directory: caster
        run: |
          mkdir -p "$RUNNER_TEMP/tools-bin"
          go build -o "$RUNNER_TEMP/tools-bin/caster" ./cmd/caster
          echo "$RUNNER_TEMP/tools-bin" >> "$GITHUB_PATH"
      - name: race tests
        run: go test -race -count=1 ./...
      - uses: golangci/golangci-lint-action@v7
        if: matrix.os == 'ubuntu-latest'
        with:
          version: v2.11.4
          working-directory: ${{ matrix.module }}
      - uses: golangci/golangci-lint-action@v7
        if: matrix.os == 'ubuntu-latest'
        with:
          version: v2.11.4
          working-directory: ${{ matrix.module }}
          args: --config .golangci.transport.yml
      - name: vulnerability scan
        if: matrix.os == 'ubuntu-latest'
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
      - name: public installation
        if: github.repository == 'hollis-labs/tools' && github.ref == 'refs/heads/main'
        env:
          MODULE: ${{ matrix.module }}
          REVISION: ${{ github.sha }}
          GOPROXY: https://proxy.golang.org
          GOPRIVATE: ''
          GONOPROXY: ''
          GONOSUMDB: ''
        run: |
          GOBIN="$RUNNER_TEMP/public-install" go install "github.com/hollis-labs/tools/$MODULE/cmd/$MODULE@$REVISION"
          go version -m "$RUNNER_TEMP/public-install/$MODULE"
