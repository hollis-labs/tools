# Folio's checks. A workflow under folio/.github/ is never run by GitHub, so the checks Folio needs live here.
# The framework-dependent preset tests (they render a Substrate app and build and run it against the real
# framework) are REQUIRED here, not skipped; modules.yml runs Folio's vet and tests too, without that environment.
#
# FOLIO_SUBSTRATE_VERSION is HAND-MAINTAINED: a pseudo-version of hollis-labs/substrate main, until the framework
# mirrors its version into folio/platform-pins.yaml (substrate `pins sync --folio` writes only the Go floor and
# the CI versions today). Update it with the framework when the presets should be proved against a newer one.
name: folio

on:
  push:
    branches: [main]
    paths:
      - "folio/**"
      - ".github/workflows/folio-checks.yml"
  pull_request:
    paths:
      - "folio/**"
      - ".github/workflows/folio-checks.yml"

permissions:
  contents: read

concurrency:
  group: folio-${{ github.ref }}
  cancel-in-progress: true

env:
  GOWORK: "off"

defaults:
  run:
    working-directory: folio

jobs:
  test:
    name: test (framework tests required)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: folio/go.mod
          cache-dependency-path: folio/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      # The go-lib conformance tests and the transport-gate proof run the pinned linter
      # (folio/platform-pins.yaml golangci_lint_version).
      - name: install golangci-lint for the preset tests
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.11.4
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: go vet
        run: go vet ./...
      - name: go test -race
        env:
          FOLIO_REQUIRE_TOOLS: "1"
          FOLIO_SUBSTRATE_VERSION: v0.1.1-0.20261112220059-4f82c47f3f4d
        run: go test -race ./...

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: folio/go.mod
          cache-dependency-path: folio/go.sum
      - uses: golangci/golangci-lint-action@v7
        with:
          version: v2.11.4
          working-directory: folio

  vuln:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: folio/go.mod
          cache-dependency-path: folio/go.sum
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...

  pins:
    name: platform pins
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Every version pin Folio carries (preset defaults, rendered workflow templates) must agree with
      # folio/platform-pins.yaml.
      - name: drift check
        run: sh scripts/check-platform-pins-drift.sh .
      - name: drift check positive control
        run: sh scripts/check-platform-pins-drift.sh . --self-test
