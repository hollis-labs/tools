# Conduit on Substrate: one binary, the API and /mcp on 127.0.0.1:7421.
#
# FIRST DEPLOY (the pre-Substrate version was run by a Cerberus-generated user unit, as `serve -addr ... -allow-dir ...`):
# the new build refuses to start on a data directory that holds only the old database (workspaces/default/main.db) and
# names `conduit migrate-legacy`. Do not let this descriptor's restart be the first thing that touches that file.
# docs/cutover-plan.md has the order: stop the unit, run `conduit migrate-legacy` and the offline identity bootstrap
# with the new binary, then `fleet-install deploy conduit`, whose preflight backs up the migrated conduit.db. The old
# main.db is never written, so it stays the rollback for that first move.
#
# The new data directory is a new one (~/.local/share/conduit-substrate): the old one keeps main.db and its blobs untouched.
#
# Settings that were flags and environment variables (-addr, -allow-dir, CONDUIT_BLOBS, CONDUIT_POLICY) are keys in the
# file named by SUBSTRATE_CONFIG (httphost.addr, conduit.*); the drop-in below sets it. The file itself is written by the
# operator (docs/conversion-notes.md, old-to-new table), not here.
#
# The unit is generated by Cerberus from the project descriptor. A Cerberus apply regenerates it with the descriptor's
# command, so the descriptor changes in the same window (docs/cutover-plan.md, section 8): until it does, an apply would
# put the old command back; the drop-in below resets ExecStart and so wins over it.
schema: fleet-deploy/v1
app: conduit
repo: hollis-labs/tools
artifact: {name: "conduit-{sha12}", tarball: "conduit_{version}_{os}_{arch}.tar.gz", sums: SHA256SUMS}
targets:
  - id: agent-os-conduit
    when: {os: linux, arch: amd64}
    hosts: [agent-os]
    binary: conduit
    install_root: ~/.local/share/fleet/releases/conduit
    symlinks:
      - path: ~/.local/bin/conduit
    unit_dropins:
      - unit: com.hollis-labs.cerberus.conduit.conduit-api.service
        name: 20-fleet-exec.conf
        content: |
          [Service]
          ExecStart=
          ExecStart=%h/.local/bin/conduit serve
          Environment=SUBSTRATE_CONFIG=%h/.config/conduit/conduit.yaml
          Environment=CONDUIT_DATA_DIR=%h/.local/share/conduit-substrate
    preflight:
      # The migrated file: it exists before the first deploy (migrate-legacy runs first) and on every later one.
      - {kind: sqlite_backup, db: ~/.local/share/conduit-substrate/conduit.db, dest: "{backup_dir}/conduit.pre-{version}.db"}
      # - {kind: migration_check, db: ~/.local/share/conduit-substrate/conduit.db}   # enable once build-info.json carries migrations_max
    restart: {via: systemd-user, unit: com.hollis-labs.cerberus.conduit.conduit-api.service}
    health: {url: "http://127.0.0.1:7421/healthz", expect_status: [200], timeout: 30s}
