# Generated from project.yaml settings.runtime; regenerate with folio deploy render.
kind: cerberus-project/v1
owner: registry
namespace: local
project:
  id: registry
  name: "Registry"
resources:
  - id: registry
    name: "Registry"
    type: process
    project: registry
    connector: local
    config:
      command:
        - "~/.local/bin/registry"
        - serve
        - --managed
        - --addr
        - 127.0.0.1:18190
      mode: os_service
      # Credentials come from operator config or the app's own identity provider.
      # env_file, when set, is a reference to an owner-only file outside the repository.
      port: 18190
      run_from: workspace
      supervisor: auto
      url: http://127.0.0.1:18190/healthz
      health_check:
        url: http://127.0.0.1:18190/healthz
    tags:
      - api
      - go
      - daemon
      - registry
