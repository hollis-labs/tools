kind: cerberus-project/v1
owner: caster
namespace: local
project:
  id: caster
  name: Caster
resources:
  # The home node's HTTP API. Loopback only: other machines reach it through
  # Tailscale Serve (https) or an SSH forward, never by binding a network
  # interface. Auth is enforce mode (identity API keys and the owner session);
  # see docs/access.md. The listen address and every other setting are keys in
  # the file SUBSTRATE_CONFIG names (httphost.addr = 127.0.0.1:8991), not flags.
  # Data lives in the user's XDG dirs, so `caster` on this machine and the
  # service share one store. Moving an existing instance: docs/cutover-plan.md
  # (no apply of this resource before its descriptor matches this file).
  - id: caster-uat
    name: Caster home node
    type: process
    project: caster
    connector: local
    config:
      build_strategy:
        kind: make_standard
        source:
          root: .
        rules:
          target: build
          output: bin/caster
      command:
        - ./bin/caster
        - serve
      dir: ~/src/tools/caster
      mode: os_service
      port: 8991
      run_from: artifact
      supervisor: auto
      url: http://127.0.0.1:8991/healthz
    tags:
      - api
      - go
      - daemon
      - uat
      - artifact
      - caster
