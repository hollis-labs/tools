# Example: clone tools into repo_root; Caster sources are in caster/.
# Catalog entry: projects/caster.yaml
# A project of its own so the MCP allowlist (mcp.servers) names caster without
# changing what any other project's sessions can see. Without an allowlist a launched
# session did not receive the caster_* tools. Widen the list if the persona needs more.
id: caster
name: Caster
repo_root: ~/src/tools
repo_url: https://github.com/hollis-labs/tools.git
tracking_root: ~/workspaces/caster
boot_fragments: []
workspace:
  default_mode: hybrid
  session_root: /var/lib/tether/workspaces/caster
mcp:
  servers: [caster]
