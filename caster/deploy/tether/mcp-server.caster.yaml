# Example Tether catalog entry: mcp-servers/caster.yaml.
# Replace the URL, binary path and token reference for your deployment.
# Pair a dedicated device with only the read/write/resolve scopes it needs.
# Keep its token outside this repository in a mode-0600 file; renew it before
# expiry. The gateway must include caster in its server allowlist.
id: caster
transport: stdio
command: /opt/caster/bin/caster
args: [mcp]
env:
  CASTER_REMOTE: https://caster.example.com
  CASTER_TOKEN_REF: file:///var/lib/caster/credentials/device.token
tags: [notes, scratchpad, drafts, refs, cas, caster]
enabled: true
