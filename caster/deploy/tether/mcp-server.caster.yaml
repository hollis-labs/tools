# Catalog entry: mcp-servers/caster.yaml  (the Tether hub catalog, /var/lib/fabric/tether/catalog)
# `caster mcp` as a client of the home node over tailnet HTTPS, scoped by its own
# paired device (label "hub-agents": caster.read, caster.write, caster.resolve),
# not the local-operator identity a bare `caster mcp` takes. The token lasts 30
# days: renew with `caster renew` using the same CASTER_REMOTE / CASTER_TOKEN_REF.
# Install on the hub: the `caster` linux binary at /var/lib/fabric/bin/caster and
# the token at credentials/caster.token (0600). The gateway also has to list
# `caster` in its --servers.
id: caster
transport: stdio
command: /var/lib/fabric/bin/caster
args: [mcp]
env:
  CASTER_REMOTE: https://caster.example.com:8443
  CASTER_TOKEN_REF: file:///var/lib/fabric/tether/catalog/credentials/caster.token
tags: [notes, scratchpad, drafts, refs, cas, caster]
enabled: true
