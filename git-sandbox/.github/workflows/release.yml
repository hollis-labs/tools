name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify script
        run: |
          test -f git-sandbox || { echo "::error file=git-sandbox::git-sandbox missing"; exit 1; }
          chmod +x git-sandbox

      - name: Attach script to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: git-sandbox
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

