folio_version: "0.1"
id: app-dashboard
version: 3.0.0
description: Dashboard app on Substrate — app-host with own identity and SQLite, an app-shell frontend on the kit-dashboard theme and a list surface; composed on substrate-frontend
author: hollis-labs
license: MIT

# 3.0.0 replaces the go-webui/Chimera dashboard of 2.x (clean break: new inputs `repo_name` and the
# `substrate_version` and kit versions, which have no defaults; `gui_host`, `chimera_*`, `design_kit_version`,
# `go_webui_version` and `base_path` are gone, a Substrate app serves at the root). It is `substrate-app` plus the
# frontend layer.

composes:
  - id: substrate-frontend
    version: ">=0.1,<1.0"
    source: local
    path: ../substrate-frontend

inputs:
  - name: repo_name
    type: string
    required: true
    pattern: "^[a-z][a-z0-9-]*$"
    description: Repository, binary and Substrate app name (lowercase, hyphens allowed)
  - name: substrate_version
    type: string
    required: true
    pattern: "^v[0-9]+\\.[0-9]+\\.[0-9]+([-+.][0-9A-Za-z.+-]*)?$"
    description: The github.com/hollis-labs/substrate version for the go.mod require line. No default.
  - name: kit_app_shell
    type: string
    required: true
    pattern: "^[0-9]+\\.[0-9]+\\.[0-9]+$"
    description: "@hollis-labs/app-shell, exact. No default."
  - name: kit_design_app_runtime
    type: string
    required: true
    pattern: "^[0-9]+\\.[0-9]+\\.[0-9]+$"
    description: "@hollis-labs/design-app-runtime, exact. No default."
  - name: kit_design_bindings
    type: string
    required: true
    pattern: "^[0-9]+\\.[0-9]+\\.[0-9]+$"
    description: "@hollis-labs/design-bindings, exact. No default."
  - name: kit_design_components
    type: string
    required: true
    pattern: "^[0-9]+\\.[0-9]+\\.[0-9]+$"
    description: "@hollis-labs/design-components, exact. No default."
  - name: kit_design_tokens
    type: string
    required: true
    pattern: "^[0-9]+\\.[0-9]+\\.[0-9]+$"
    description: "@hollis-labs/design-tokens, exact. No default."
  - name: kit_dashboard
    type: string
    required: true
    pattern: "^[0-9]+\\.[0-9]+\\.[0-9]+$"
    description: "@hollis-labs/kit-dashboard, exact. No default."
  - name: kit_plugin_host_ui
    type: string
    required: true
    pattern: "^[0-9]+\\.[0-9]+\\.[0-9]+$"
    description: "@hollis-labs/plugin-host-ui, exact (app-shell depends on it with a range, so it is pinned directly), from the Substrate bom.yaml kits block. No default."

files:
  source: ./files
  template_suffix: .tmpl
