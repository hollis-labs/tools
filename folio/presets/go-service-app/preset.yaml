folio_version: "0.1"
id: go-service-app
version: 0.2.0
description: New Go service app — composition root wiring go-apppaths and go-otel, a service-layer skeleton and a transport-boundary lint gate; composed on go-baseline
author: hollis-labs
license: MIT

# Composes `go-baseline` (CI, lint, hooks, LICENSE, CHANGELOG, AGENTS.md) and
# adds what a service app with transports (HTTP/MCP/CLI adapters) needs:
# go.mod, a cmd/<repo_name> entrypoint (the composition root — outside the
# transport scope by construction), `.golangci.transport.yml` (the standalone
# second config: "transports call the service layer, not the store"),
# `docs/transport-boundary.md` and the ratchet ceiling file.
#
# Why go-baseline and not `base`: base renders ci.yml with a literal
# `go-version` (the transport gate requires `go-version-file: go.mod`), a
# Makefile and a hello-world main, and forbids nothing this preset wants; it
# also has no CHANGELOG/AGENTS.md. go-baseline renders check.yml with
# `go-version-file: go.mod` and golangci-lint v2.11.4. The cost is the two
# files go-baseline deliberately does not render (go.mod, one Go package —
# check.yml fails on "no packages"), which this preset owns, as go-lib does.
#
# The composition root is real, not a stub: `cmd/<repo_name>/main.go` resolves
# paths with go-apppaths (`paths.Resolve`), gates telemetry with go-otel
# (`EnabledFromEnv` / `InitOrWarn`; go-baseline renders none, that is an
# application concern and lands here), opens a placeholder store and builds
# `internal/service` (unexported store, `Store()` escape hatch, `New(store)`:
# Torque's shape). The placeholder store renders at a fixed `internal/store`
# (folio refuses a path separator in a templated file name), so `store_pkg_path`
# only steers the doc and the commented depguard rule. Both libraries are called, not reimplemented. go.sum is not
# rendered: run `go mod tidy` once after generating.
#
# `go-baseline`'s own `.golangci.yml` is untouched: the transport config is a
# SECOND file, run with `--config .golangci.transport.yml`.
#
# The CLI prompts only for THIS preset's inputs, so the required ones are
# redeclared here; optional shared inputs (go_version, description, ...) are
# declared once in go-baseline and flow through.

composes:
  - id: go-baseline
    version: ">=0.1,<1.0"
    source: local
    path: ../go-baseline
    vars:
      agents_start_here: |-
        - `.golangci.transport.yml` — the transport-boundary gate; `docs/transport-boundary.md` says how to run and ratchet it.
        - `cmd/{{ .inputs.repo_name }}/main.go` — the composition root: resolves paths (go-apppaths), gates telemetry (go-otel), opens the store and builds the service layer; the only place that opens the store.
        - `internal/service/service.go` — the service layer: unexported store, `Store()` escape hatch, `New(store)`.
        - Run `go mod tidy` once after generating: `go.sum` is not rendered.
        - `.github/workflows/check.yml` — the full CI gate.
      agents_boundaries: |-
        - Transports (the packages matched by `transport_dirs_regex` in `.golangci.transport.yml`) call the service layer, never `{{ .inputs.store_pkg_name }}.{{ .inputs.store_type }}` methods or raw SQL; the gate is `.golangci.transport.yml`, its ceiling `.github/quality/transport-baseline.txt` only decreases.
        - TODO(author): what a competent agent will get wrong here — invariants, the test that guards each by name, what must never happen.

inputs:
  - name: repo_name
    type: string
    required: true
    pattern: "^[a-z][a-z0-9-]*$"
    description: Repository / Go module name (lowercase, hyphens allowed, e.g. my-service)
  - name: store_pkg_name
    type: string
    required: true
    pattern: "^[a-z][a-z0-9_]*$"
    description: >-
      Go package NAME (not import path) of the store, e.g. store, sqlite,
      storage, sqlstore. Rule A matches <package name>.<Type>.<Method>.
  - name: store_type
    type: string
    required: true
    pattern: "^[A-Z][A-Za-z0-9_]*$"
    description: Exported handle type in that package whose methods transports must not call (Store, Repository).
  - name: transport_dirs_regex
    type: string
    default: "^internal/(api|mcp)/"
    pattern: "^[^'\\n]+$"
    description: >-
      Module-relative regex of the transport packages (matched against file
      paths under relative-path-mode: gomod). No single quote: it is rendered
      inside a single-quoted YAML string.
  - name: store_pkg_path
    type: string
    default: "internal/store"
    pattern: "^[a-z][a-zA-Z0-9_./-]*$"
    description: >-
      Module-relative import path of the store package. Used only by the
      commented-out depguard Rule B (import ban) and the doc.

  - name: app_name
    type: string
    default: ""
    pattern: "^([a-z][a-z0-9-]*)?$"
    description: >-
      The go-apppaths identity: names the XDG directories and prefixes the
      <APP>_DB_PATH / <APP>_WORKSPACE variables paths.Resolve reads. Empty =
      repo_name.
  - name: otel_env_var
    type: string
    default: ""
    pattern: "^([A-Z][A-Z0-9_]*)?$"
    description: >-
      The app-specific variable that turns telemetry on (opt-in;
      HOLLIS_OTEL_ENABLED, portfolio-wide, wins over it). Empty =
      <APP>_OTEL_ENABLED derived from app_name.
  - name: legacy_names
    type: string
    default: ""
    pattern: "^([a-z][a-z0-9-]*(,[a-z][a-z0-9-]*)*)?$"
    description: >-
      Comma-separated earlier names of this app; renders
      paths.WithLegacyNames(...) so their data directories are adopted on first
      run. Empty = none (a new app has no legacy).

computed:
  app: '{{ default .inputs.repo_name .inputs.app_name }}'
  env_prefix: '{{ upper (replace "-" "_" (default .inputs.repo_name .inputs.app_name)) }}'
  otel_var: '{{ default (printf "%s_OTEL_ENABLED" (upper (replace "-" "_" (default .inputs.repo_name .inputs.app_name)))) .inputs.otel_env_var }}'
  legacy_args: '{{ if .inputs.legacy_names }}{{ range $i, $n := split "," .inputs.legacy_names }}{{ if $i }}, {{ end }}{{ quote $n }}{{ end }}{{ end }}'

files:
  source: ./files
  template_suffix: .tmpl

sync:
  default: prompt
  rules:
    - glob: ".golangci.transport.yml"
      policy: overwrite
    - glob: "docs/transport-boundary.md"
      policy: overwrite
    - glob: ".github/quality/transport-baseline.txt"
      policy: skip
    - glob: "internal/**"
      policy: skip
    - glob: "cmd/**"
      policy: skip
