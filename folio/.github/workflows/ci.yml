name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: go mod download
        run: go mod download

      - name: go vet
        run: go vet ./...

      # The framework-dependent preset tests (render, build and run a Substrate app against the real
      # framework) are required here, not skipped. FOLIO_SUBSTRATE_VERSION is HAND-MAINTAINED, a pseudo-version
      # of hollis-labs/substrate main (4f82c47f3f4d), until the framework mirrors its version into
      # platform-pins.yaml (docs/conversion-notes.md, Gap 2).
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      # The go-lib conformance tests run the pinned linter (platform-pins.yaml golangci_lint_version).
      - name: install golangci-lint for the preset tests
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.11.4
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: go test -race
        env:
          FOLIO_REQUIRE_TOOLS: "1"
          FOLIO_SUBSTRATE_VERSION: v0.1.1-0.20261112220059-4f82c47f3f4d
        run: go test -race ./...

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.11.4

  vuln:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      # Pinned, not @latest: an unpinned scanner changes its verdict without a
      # commit. The version is platform-pins.yaml's govulncheck_version.
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...

  pins:
    name: platform pins
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Every version pin this repo carries (preset defaults, rendered workflow
      # templates, this CI) must agree with platform-pins.yaml.
      - name: drift check
        run: sh scripts/check-platform-pins-drift.sh .

      - name: drift check positive control
        run: sh scripts/check-platform-pins-drift.sh . --self-test
