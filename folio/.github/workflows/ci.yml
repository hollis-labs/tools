name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: go mod download
        run: go mod download

      - name: go vet
        run: go vet ./...

      - name: go test -race
        run: go test -race ./...

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.11.4

  vuln:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      # Pinned, not @latest: an unpinned scanner changes its verdict without a
      # commit. The version is platform-pins.yaml's govulncheck_version.
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...

  pins:
    name: platform pins
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Every version pin this repo carries (preset defaults, rendered workflow
      # templates, this CI) must agree with platform-pins.yaml.
      - name: drift check
        run: sh scripts/check-platform-pins-drift.sh .

      - name: drift check positive control
        run: sh scripts/check-platform-pins-drift.sh . --self-test
